<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370"><rect width="1040" height="370" rx="20" fill="#eef2f9"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="24" font-weight="700" fill="#192435">FigNexus · 三步开始设计</text><text x="32" y="76" font-size="14" fill="#627084">无需空白插件，无需获取 ID；直接导入安装好的 manifest。</text><g fill="white"><rect x="32" y="108" width="308" height="184" rx="16"/><rect x="366" y="108" width="308" height="184" rx="16"/><rect x="700" y="108" width="308" height="184" rx="16"/></g><g fill="#215cf2" font-size="26" font-weight="700"><text x="52" y="147">01</text><text x="386" y="147">02</text><text x="720" y="147">03</text></g><g fill="#192435" font-size="18" font-weight="600"><text x="52" y="181">下载并安装</text><text x="386" y="181">直接导入 FigNexus</text><text x="720" y="181">配对与设计</text></g><g fill="#627084" font-size="14"><text x="52" y="213">解压 Windows ZIP → install.cmd</text><text x="52" y="239">预览配置 → 输入 YES</text><text x="52" y="265">安装器显示 manifest 完整路径</text><text x="386" y="213">Figma → Development → Import</text><text x="386" y="239">选择安装目录/plugin/manifest.json</text><text x="386" y="265">运行 FigNexus，不用 New plugin</text><text x="720" y="213">重启 Codex → 配对本机</text><text x="720" y="239">核对六位数字 → 点“是”</text><text x="720" y="265">开启编辑 → 在 Codex 说需求</text><text x="32" y="333">以后：运行插件即可自动连接。升级已有 ID 会自动复用；新路径直接重新导入，无需创建空白插件。</text></g></g></svg>
