<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370"><rect width="1040" height="370" rx="20" fill="#eef2f9"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="24" font-weight="700" fill="#192435">FigNexus · 一个入口，两步开始</text><text x="32" y="76" font-size="14" fill="#627084">无需单独安装，无需空白插件；首次配置一次，以后直接启动。</text><g fill="white"><rect x="32" y="108" width="476" height="184" rx="16"/><rect x="532" y="108" width="476" height="184" rx="16"/></g><g fill="#215cf2" font-size="26" font-weight="700"><text x="52" y="147">01</text><text x="552" y="147">02</text></g><g fill="#192435" font-size="18" font-weight="600"><text x="52" y="181">解压后双击“开始使用”</text><text x="552" y="181">在 Figma 导入并配对</text></g><g fill="#627084" font-size="14"><text x="52" y="213">首次：预览配置 → 输入 YES → 自动安装和启动</text><text x="52" y="239">随后显示 manifest 完整路径</text><text x="52" y="265">以后：同一入口直接启动，不重复安装</text><text x="552" y="213">Development → Import → 选择显示的 manifest</text><text x="552" y="239">重启 Codex 一次 → 核对六位码并确认配对</text><text x="552" y="265">开启编辑 → 在 Codex 说需求</text><text x="32" y="333">install.cmd 仅保留作兼容入口。升级双击新包的“开始使用”；已有 ID 自动复用，无需 New plugin。</text></g></g></svg>
