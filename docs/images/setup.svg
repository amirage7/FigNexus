<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370"><rect width="1040" height="370" rx="20" fill="#eef2f9"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="32" y="48" font-size="24" font-weight="700" fill="#192435">FigNexus · 首次安装</text><text x="32" y="76" font-size="14" fill="#627084">安装器配置 Codex；Figma 首次导入；本机配对后开始使用。</text><g fill="white"><rect x="32" y="108" width="226" height="184" rx="16"/><rect x="282" y="108" width="226" height="184" rx="16"/><rect x="532" y="108" width="226" height="184" rx="16"/><rect x="782" y="108" width="226" height="184" rx="16"/></g><g fill="#215cf2" font-size="26" font-weight="700"><text x="52" y="147">01</text><text x="302" y="147">02</text><text x="552" y="147">03</text><text x="802" y="147">04</text></g><g fill="#192435" font-size="18" font-weight="600"><text x="52" y="181">下载并安装</text><text x="302" y="181">取得插件 ID</text><text x="552" y="181">导入 FigNexus</text><text x="802" y="181">配对与设计</text></g><g fill="#627084" font-size="14"><text x="52" y="213">下载 Windows ZIP</text><text x="52" y="239">解压 → install.cmd</text><text x="52" y="265">预览配置 → 输入 YES</text><text x="302" y="213">Figma 创建开发插件</text><text x="302" y="239">设置窗口选择生成的</text><text x="302" y="265">manifest.json</text><text x="552" y="213">Figma 导入安装目录的</text><text x="552" y="239">plugin/manifest.json</text><text x="552" y="265">运行 FigNexus</text><text x="802" y="213">重启 Codex → 配对本机</text><text x="802" y="239">核对数字 → 点“是”</text><text x="802" y="265">开启编辑 → 说需求</text><text x="32" y="333">以后：打开 Codex → 运行 FigNexus → 自动在线 → 开启编辑。无需每次启动助手或输入令牌。</text></g></g></svg>
